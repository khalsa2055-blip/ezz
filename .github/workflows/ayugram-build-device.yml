name: AyuGram iOS — Build Device (Apple signing required)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-device:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v5

      - name: Select Xcode 26.2 when available
        run: |
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.2.app/Contents/Developer"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Validate required Telegram API secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          test -n "$TELEGRAM_API_ID" || { echo "Missing repository secret TELEGRAM_API_ID"; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "Missing repository secret TELEGRAM_API_HASH"; exit 1; }
          case "$TELEGRAM_API_ID" in
            *[!0-9]*) echo "TELEGRAM_API_ID must be numeric"; exit 1 ;;
          esac

      - name: Validate Apple signing secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CODESIGNING_ZIP_BASE64: ${{ secrets.APPLE_CODESIGNING_ZIP_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          test -n "$APPLE_TEAM_ID" || { echo "Missing APPLE_TEAM_ID. Add your Apple Developer Team ID in GitHub Secrets."; exit 1; }
          test -n "$APPLE_CODESIGNING_ZIP_BASE64" || { echo "Missing APPLE_CODESIGNING_ZIP_BASE64. Add the signing bundle secret."; exit 1; }
          test -n "$APPLE_P12_PASSWORD" || { echo "Missing APPLE_P12_PASSWORD. Add the password for the .p12 certificate."; exit 1; }
          case "$APPLE_TEAM_ID" in
            *[!0-9]*) echo "APPLE_TEAM_ID must be numeric"; exit 1 ;;
          esac
          echo "Apple signing secrets are present."

      - name: Clone Telegram-iOS baseline
        run: |
          git clone --recursive https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios
          cd telegram-ios
          git checkout --detach 6ad963e5b62d354da79040f388ae2b9132fb17b8

      - name: Check Telegram baseline
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          import json
          with open("versions.json", encoding="utf-8") as f:
              v = json.load(f)
          assert v["app"] == "12.9.2", v
          assert v["xcode"] == "26.2", v
          print("Baseline:", v["app"], "Xcode:", v["xcode"], "macOS:", v["macos"])
          PY

      - name: Validate and apply AyuGram patch
        run: |
          cp patches/ayugram-1.3.0.patch telegram-ios/ayugram-1.3.0.patch
          cd telegram-ios
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path("ayugram-1.3.0.patch").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^diff --git ", patch)
          applied = []

          for raw in sections[1:]:
              lines = raw.splitlines()
              header = lines[0]
              m = re.match(r"a/(.+?) b/(.+)$", header)
              if not m:
                  raise SystemExit(f"Bad diff header: {header!r}")
              target = Path(m.group(2))
              meta = lines[1:8]
              is_new = any(x.startswith("new file mode ") for x in meta)
              is_deleted = any(x.startswith("deleted file mode ") for x in meta)

              hunks = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith("@@ "):
                      hm = re.match(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@", lines[i])
                      if not hm:
                          raise SystemExit(f"Bad hunk header in {target}: {lines[i]!r}")
                      old_start = int(hm.group(1))
                      body = []
                      i += 1
                      while i < len(lines) and not lines[i].startswith("@@ ") and not lines[i].startswith("diff --git "):
                          if not lines[i].startswith("\\ No newline at end of file"):
                              body.append(lines[i])
                          i += 1
                      hunks.append((old_start, body))
                  else:
                      i += 1

              if is_deleted:
                  if target.exists():
                      target.unlink()
                  applied.append(str(target))
                  continue

              if is_new:
                  new_lines = []
                  for line in hunks[0][1] if hunks else []:
                      if line.startswith("+") or line.startswith(" "):
                          new_lines.append(line[1:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text("\n".join(new_lines) + ("\n" if new_lines else ""), encoding="utf-8")
                  applied.append(str(target))
                  continue

              if not target.exists():
                  raise SystemExit(f"Target file missing: {target}")
              current = target.read_text(encoding="utf-8").splitlines()
              cursor = 0

              for old_line, body in hunks:
                  old_lines = [x[1:] for x in body if x.startswith(" ") or x.startswith("-")]
                  new_lines = [x[1:] for x in body if x.startswith(" ") or x.startswith("+")]

                  if old_lines:
                      hint = max(0, old_line - 1)
                      positions = [hint] + list(range(cursor, max(cursor, len(current) - len(old_lines) + 1)))
                      seen = set()
                      found = None
                      for pos in positions:
                          if pos in seen:
                              continue
                          seen.add(pos)
                          if pos + len(old_lines) <= len(current) and current[pos:pos + len(old_lines)] == old_lines:
                              found = pos
                              break
                      if found is None:
                          raise SystemExit(f"Context mismatch applying {target} near old line {old_line}")
                      current[found:found + len(old_lines)] = new_lines
                      cursor = found + len(new_lines)
                  else:
                      insert_at = max(0, min(len(current), old_line - 1))
                      current[insert_at:insert_at] = new_lines
                      cursor = insert_at + len(new_lines)

              target.write_text("\n".join(current) + ("\n" if current else ""), encoding="utf-8")
              applied.append(str(target))

          print("Applied", len(applied), "diff sections")
          PY
          git diff --check

      - name: Create device build configuration
        working-directory: telegram-ios
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          src = json.loads(Path("build-system/template_minimal_development_configuration.json").read_text())
          src["bundle_id"] = "org.ayugram.ezz"
          src["api_id"] = os.environ["TELEGRAM_API_ID"]
          src["api_hash"] = os.environ["TELEGRAM_API_HASH"]
          src["team_id"] = os.environ["APPLE_TEAM_ID"]
          src["is_internal_build"] = "true"
          src["is_appstore_build"] = "false"
          Path("build-system/ayugram-ci-configuration.json").write_text(
              json.dumps(src, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Prepare Apple signing material
        working-directory: telegram-ios
        env:
          APPLE_CODESIGNING_ZIP_BASE64: ${{ secrets.APPLE_CODESIGNING_ZIP_BASE64 }}
          APPLE_P12_PASSWORD: ${{ secrets.APPLE_P12_PASSWORD }}
        run: |
          set -e
          rm -rf "$GITHUB_WORKSPACE/telegram-ios/build-signing"
          mkdir -p "$GITHUB_WORKSPACE/telegram-ios/build-signing"
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          data = base64.b64decode(os.environ["APPLE_CODESIGNING_ZIP_BASE64"])
          Path("/tmp/ayugram-signing.zip").write_bytes(data)
          PY
          unzip -q -o /tmp/ayugram-signing.zip -d "$GITHUB_WORKSPACE/telegram-ios/build-signing"
          rm -f /tmp/ayugram-signing.zip

          test -d "$GITHUB_WORKSPACE/telegram-ios/build-signing/profiles"
          test -d "$GITHUB_WORKSPACE/telegram-ios/build-signing/certs"

          p12=$(find "$GITHUB_WORKSPACE/telegram-ios/build-signing/certs" -type f -name "*.p12" -print -quit)
          test -n "$p12" || { echo "No .p12 certificate found under certs/."; exit 1; }

          security create-keychain -p "" build-signing.keychain-db
          security set-keychain-settings -lut 21600 build-signing.keychain-db
          security unlock-keychain -p "" build-signing.keychain-db
          security import "$p12" -k build-signing.keychain-db -P "$APPLE_P12_PASSWORD" -A -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s build-signing.keychain-db login.keychain-db
          security default-keychain -s build-signing.keychain-db

          echo "Signing material prepared."
          find "$GITHUB_WORKSPACE/telegram-ios/build-signing/profiles" -maxdepth 1 -type f -name "*.mobileprovision" -print | sed 's#^.*/##' | sort

      - name: Build AyuGram for iPhone (arm64)
        working-directory: telegram-ios
        run: |
          python3 -u build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ayugram-ci-configuration.json \
            --codesigningInformationPath="$GITHUB_WORKSPACE/telegram-ios/build-signing" \
            --buildNumber=100004 \
            --configuration=debug_arm64

      - name: Collect signed device IPA
        working-directory: telegram-ios
        run: |
          set -e
          mkdir -p ci-artifacts/check
          ipa="bazel-bin/Telegram/Telegram.ipa"
          if [ ! -f "$ipa" ]; then
            ipa=$(find bazel-bin -type f -name "Telegram.ipa" -print -quit || true)
          fi
          if [ -z "$ipa" ] || [ ! -f "$ipa" ]; then
            echo "No device IPA was produced." >&2
            find bazel-bin -maxdepth 5 -type f | head -200 || true
            exit 1
          fi

          cp "$ipa" "ci-artifacts/AyuGram-iOS-device.ipa"

          unzip -q -o "$ipa" -d ci-artifacts/check
          app=$(find ci-artifacts/check/Payload -type d -name "*.app" -print -quit)
          test -n "$app" && test -d "$app"
          echo "Device app bundle: $app"

          rm -rf ci-artifacts/check
          ls -lh ci-artifacts

      - name: Upload device IPA
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-device-${{ github.run_number }}
          path: telegram-ios/ci-artifacts
          if-no-files-found: error
