name: AyuGram iOS — Build AltStore IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ayugram-build-altstore.yml'
      - 'patches/**'
      - 'AyuGram/**'
      - 'submodules/**'

permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-altstore:
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Checkout workspace
        uses: actions/checkout@v5

      - name: Restore Bazel build cache
        uses: actions/cache@v4
        with:
          path: ~/telegram-bazel-cache
          key: ${{ runner.os }}-telegram-bazel-6ad963e5b62d-${{ hashFiles('patches/**') }}
          restore-keys: |
            ${{ runner.os }}-telegram-bazel-6ad963e5b62d-

      - name: Select Xcode 26.2 when available
        run: |
          if [ -d "/Applications/Xcode_26.2.app" ]; then
            sudo xcode-select -s "/Applications/Xcode_26.2.app/Contents/Developer"
          fi
          xcodebuild -version
          xcode-select -p

      - name: Validate required Telegram API secrets
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
        run: |
          test -n "$TELEGRAM_API_ID" || { echo "Missing repository secret TELEGRAM_API_ID"; exit 1; }
          test -n "$TELEGRAM_API_HASH" || { echo "Missing repository secret TELEGRAM_API_HASH"; exit 1; }
          case "$TELEGRAM_API_ID" in
            *[!0-9]*) echo "TELEGRAM_API_ID must be numeric"; exit 1 ;;
          esac
          echo "Telegram API credentials are present."

      - name: Clone Telegram-iOS baseline
        run: |
          git clone --recursive https://github.com/TelegramMessenger/Telegram-iOS.git telegram-ios
          cd telegram-ios
          git checkout --detach 6ad963e5b62d354da79040f388ae2b9132fb17b8

      - name: Check Telegram baseline
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          import json
          with open("versions.json", encoding="utf-8") as f:
              v = json.load(f)
          assert v["app"] == "12.9.2", v
          assert v["xcode"] == "26.2", v
          print("Baseline:", v["app"], "Xcode:", v["xcode"], "macOS:", v["macos"])
          PY

      - name: Validate and apply AyuGram patch
        run: |
          cp patches/ayugram-1.3.0.patch telegram-ios/ayugram-1.3.0.patch
          cd telegram-ios
          python3 - <<'PY'
          from pathlib import Path
          import re

          patch = Path("ayugram-1.3.0.patch").read_text(encoding="utf-8")
          sections = re.split(r"(?m)^diff --git ", patch)
          applied = []

          for raw in sections[1:]:
              lines = raw.splitlines()
              header = lines[0]
              m = re.match(r"a/(.+?) b/(.+)$", header)
              if not m:
                  raise SystemExit(f"Bad diff header: {header!r}")
              target = Path(m.group(2))
              meta = lines[1:8]
              is_new = any(x.startswith("new file mode ") for x in meta)
              is_deleted = any(x.startswith("deleted file mode ") for x in meta)

              hunks = []
              i = 0
              while i < len(lines):
                  if lines[i].startswith("@@ "):
                      hm = re.match(r"^@@ -(\d+)(?:,(\d+))? \+(\d+)(?:,(\d+))? @@", lines[i])
                      if not hm:
                          raise SystemExit(f"Bad hunk header in {target}: {lines[i]!r}")
                      old_start = int(hm.group(1))
                      body = []
                      i += 1
                      while i < len(lines) and not lines[i].startswith("@@ ") and not lines[i].startswith("diff --git "):
                          if not lines[i].startswith("\\ No newline at end of file"):
                              body.append(lines[i])
                          i += 1
                      hunks.append((old_start, body))
                  else:
                      i += 1

              if is_deleted:
                  if target.exists():
                      target.unlink()
                  applied.append(str(target))
                  continue

              if is_new:
                  new_lines = []
                  for line in hunks[0][1] if hunks else []:
                      if line.startswith("+") or line.startswith(" "):
                          new_lines.append(line[1:])
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_text("\n".join(new_lines) + ("\n" if new_lines else ""), encoding="utf-8")
                  applied.append(str(target))
                  continue

              if not target.exists():
                  raise SystemExit(f"Target file missing: {target}")
              current = target.read_text(encoding="utf-8").splitlines()
              cursor = 0

              for old_line, body in hunks:
                  old_lines = [x[1:] for x in body if x.startswith(" ") or x.startswith("-")]
                  new_lines = [x[1:] for x in body if x.startswith(" ") or x.startswith("+")]

                  if old_lines:
                      hint = max(0, old_line - 1)
                      positions = [hint] + list(range(cursor, max(cursor, len(current) - len(old_lines) + 1)))
                      seen = set()
                      found = None
                      for pos in positions:
                          if pos in seen:
                              continue
                          seen.add(pos)
                          if pos + len(old_lines) <= len(current) and current[pos:pos + len(old_lines)] == old_lines:
                              found = pos
                              break
                      if found is None:
                          raise SystemExit(f"Context mismatch applying {target} near old line {old_line}")
                      current[found:found + len(old_lines)] = new_lines
                      cursor = found + len(new_lines)
                  else:
                      insert_at = max(0, min(len(current), old_line - 1))
                      current[insert_at:insert_at] = new_lines
                      cursor = insert_at + len(new_lines)

              target.write_text("\n".join(current) + ("\n" if current else ""), encoding="utf-8")
              applied.append(str(target))

          print("Applied", len(applied), "diff sections")
          for path in applied:
              print("  ", path)
          PY
          git diff --check

      - name: Fix binary-output decoding in Telegram build helper
        working-directory: telegram-ios
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("build-system/Make/BuildEnvironment.py")
          s = p.read_text(encoding="utf-8")
          old = "    output_string = output_data.decode('utf-8')"
          new = "    output_string = output_data.decode('utf-8', errors='replace')"
          if old not in s:
              raise SystemExit("Expected BuildEnvironment.py decode line was not found")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Prepare AltStore-compatible device signing material
        working-directory: telegram-ios
        env:
          BUNDLE_ID: org.ayugram.ezz
        run: |
          set -euo pipefail

          rm -rf ci-codesigning
          mkdir -p ci-codesigning/certs ci-codesigning/profiles

          cp build-system/fake-codesigning/certs/SelfSigned.p12 ci-codesigning/certs/SelfSigned.p12
          cp build-system/fake-codesigning/certs/Public.cer ci-codesigning/certs/Public.cer

          security cms -D -i build-system/fake-codesigning/profiles/Telegram.mobileprovision -o "$RUNNER_TEMP/base-profile.plist"

          TEAM_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:com.apple.developer.team-identifier' "$RUNNER_TEMP/base-profile.plist")
          OLD_BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/base-profile.plist" | sed "s/^$TEAM_ID\\.//")
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "OLD_BUNDLE_ID=$OLD_BUNDLE_ID" >> "$GITHUB_ENV"

          KEYCHAIN_PATH="$RUNNER_TEMP/ayugram-codesign.keychain-db"
          KEYCHAIN_PASSWORD="ayugram-temp"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          security import ci-codesigning/certs/SelfSigned.p12 \
            -k "$KEYCHAIN_PATH" \
            -P "" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          SIGNING_IDENTITY=$(openssl pkcs12 -in ci-codesigning/certs/SelfSigned.p12 -passin pass: -nokeys -legacy 2>/dev/null | openssl x509 -noout -subject -nameopt oneline,-esc_msb | sed -n 's/.*CN = \([^,]*\).*/\1/p')
          if [ -z "$SIGNING_IDENTITY" ]; then
            echo "Could not extract the signing certificate common name." >&2
            exit 1
          fi

          echo "TEAM_ID=$TEAM_ID"
          echo "OLD_BUNDLE_ID=$OLD_BUNDLE_ID"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY"

          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"
          export TEAM_ID OLD_BUNDLE_ID SIGNING_IDENTITY

          python3 - <<'PY'
          from pathlib import Path
          import plistlib
          import subprocess
          import tempfile
          import os

          team_id = os.environ["TEAM_ID"]
          old_bundle_id = os.environ["OLD_BUNDLE_ID"]
          bundle_id = os.environ["BUNDLE_ID"]
          identity = os.environ["SIGNING_IDENTITY"]
          keychain = os.path.join(os.environ["RUNNER_TEMP"], "ayugram-codesign.keychain-db")

          src_dir = Path("build-system/fake-codesigning/profiles")
          dst_dir = Path("ci-codesigning/profiles")
          dst_dir.mkdir(parents=True, exist_ok=True)

          for src in sorted(src_dir.glob("*.mobileprovision")):
              decoded = subprocess.check_output(["security", "cms", "-D", "-i", str(src)])
              profile = plistlib.loads(decoded)
              ent = profile["Entitlements"]

              old_app_id = ent.get("application-identifier", "")
              prefix = team_id + "." + old_bundle_id
              if not old_app_id.startswith(prefix):
                  raise SystemExit(
                      f"{src.name}: unexpected application-identifier {old_app_id!r}; expected prefix {prefix!r}"
                  )

              suffix = old_app_id[len(prefix):]
              new_prefix = team_id + "." + bundle_id
              ent["application-identifier"] = new_prefix + suffix
              ent["com.apple.developer.team-identifier"] = team_id

              for key in ("keychain-access-groups",):
                  value = ent.get(key)
                  if isinstance(value, list):
                      ent[key] = [
                          (new_prefix + item[len(prefix):])
                          if isinstance(item, str) and item.startswith(prefix)
                          else item
                          for item in value
                      ]

              value = ent.get("com.apple.developer.ubiquity-kvstore-identifier")
              if isinstance(value, str) and value.startswith(prefix):
                  ent["com.apple.developer.ubiquity-kvstore-identifier"] = new_prefix + value[len(prefix):]

              old_group = "group." + old_bundle_id
              new_group = "group." + bundle_id
              value = ent.get("com.apple.security.application-groups")
              if isinstance(value, list):
                  ent["com.apple.security.application-groups"] = [
                      new_group + item[len(old_group):]
                      if isinstance(item, str) and item.startswith(old_group)
                      else item
                      for item in value
                  ]

              old_icloud = "iCloud." + old_bundle_id
              new_icloud = "iCloud." + bundle_id
              for key in ("com.apple.developer.icloud-container-identifiers", "com.apple.developer.ubiquity-container-identifiers"):
                  value = ent.get(key)
                  if isinstance(value, list):
                      ent[key] = [
                          new_icloud + item[len(old_icloud):]
                          if isinstance(item, str) and item.startswith(old_icloud)
                          else item
                          for item in value
                      ]

              profile.pop("DER-Encoded-Profile", None)

              with tempfile.NamedTemporaryFile(suffix=".plist", delete=False) as f:
                  tmp_path = Path(f.name)

              try:
                  tmp_path.write_bytes(plistlib.dumps(profile, fmt=plistlib.FMT_BINARY))
                  out = dst_dir / src.name
                  subprocess.run(
                      [
                          "security", "cms", "-S",
                          "-k", keychain,
                          "-N", identity,
                          "-i", str(tmp_path),
                          "-o", str(out),
                      ],
                      check=True,
                  )
              finally:
                  tmp_path.unlink(missing_ok=True)

              print(f"Generated {out}: {ent['application-identifier']}")
          PY

          find ci-codesigning/profiles -name '*.mobileprovision' -print

      - name: Create device build configuration
        working-directory: telegram-ios
        env:
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TEAM_ID: ${{ env.TEAM_ID }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          src = json.loads(
              Path("build-system/template_minimal_development_configuration.json").read_text()
          )
          src["bundle_id"] = "org.ayugram.ezz"
          src["api_id"] = os.environ["TELEGRAM_API_ID"]
          src["api_hash"] = os.environ["TELEGRAM_API_HASH"]
          src["team_id"] = os.environ["TEAM_ID"]
          src["is_internal_build"] = "true"
          src["is_appstore_build"] = "false"

          Path("build-system/ayugram-altstore-configuration.json").write_text(
              json.dumps(src, indent=2) + "\n",
              encoding="utf-8"
          )
          PY

      - name: Build device IPA
        working-directory: telegram-ios
        run: |
          set -euo pipefail
          rm -rf ci-artifacts

          python3 build-system/Make/Make.py \
            --cacheDir="$HOME/telegram-bazel-cache" \
            build \
            --configurationPath=build-system/ayugram-altstore-configuration.json \
            --codesigningInformationPath=ci-codesigning \
            --buildNumber=$((100000 + GITHUB_RUN_NUMBER)) \
            --configuration=release_arm64 \
            --outputBuildArtifactsPath=ci-artifacts

      - name: Verify IPA is for physical iPhone and is signed
        working-directory: telegram-ios
        run: |
          set -euo pipefail

          test -f ci-artifacts/Telegram.ipa
          mkdir -p ci-artifacts/check
          unzip -q -o ci-artifacts/Telegram.ipa -d ci-artifacts/check

          app=$(find ci-artifacts/check/Payload -maxdepth 1 -type d -name '*.app' -print -quit)
          test -n "$app"

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          executable=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")

          echo "Bundle ID: $bundle_id"
          echo "Executable: $executable"

          test "$bundle_id" = "org.ayugram.ezz"

          main_binary="$app/$executable"
          file "$main_binary"
          lipo -info "$main_binary"
          lipo "$main_binary" -verify_arch arm64
          if lipo "$main_binary" -verify_arch x86_64 >/dev/null 2>&1; then
            echo "Unexpected simulator/x86_64 slice detected."
            exit 1
          fi

          codesign --verify --deep --strict "$app"
          security cms -D -i "$app/embedded.mobileprovision" >/dev/null

          python3 - <<'PY'
          import plistlib
          import subprocess
          from pathlib import Path

          app = Path("ci-artifacts/check/Payload").glob("*.app").__next__()

          expected = {
              "org.ayugram.ezz",
              "org.ayugram.ezz.BroadcastUpload",
              "org.ayugram.ezz.SiriIntents",
              "org.ayugram.ezz.NotificationContent",
              "org.ayugram.ezz.NotificationService",
              "org.ayugram.ezz.Share",
              "org.ayugram.ezz.Widget",
          }

          bundles = [app] + sorted((app / "PlugIns").glob("*.appex"))
          seen = set()

          for bundle in bundles:
              info = plistlib.loads((bundle / "Info.plist").read_bytes())
              bundle_id = info.get("CFBundleIdentifier")
              if bundle_id not in expected:
                  raise SystemExit(f"Unexpected bundle identifier: {bundle_id!r} ({bundle})")
              seen.add(bundle_id)

              profile = subprocess.check_output(
                  ["security", "cms", "-D", "-i", str(bundle / "embedded.mobileprovision")]
              )
              prof = plistlib.loads(profile)
              ent = prof.get("Entitlements", {})
              application_id = ent.get("application-identifier", "")
              if not application_id.endswith(bundle_id):
                  raise SystemExit(
                      f"{bundle}: profile application-identifier {application_id!r} "
                      f"does not match {bundle_id!r}"
                  )
              if ent.get("get-task-allow") is not False:
                  raise SystemExit(f"{bundle}: get-task-allow is not false")
              groups = ent.get("com.apple.security.application-groups", [])
              if groups and groups != ["group.org.ayugram.ezz"]:
                  raise SystemExit(f"{bundle}: unexpected app groups {groups!r}")

              print(
                  f"Validated {bundle.relative_to(app.parent)}: "
                  f"{bundle_id}, profile={application_id}"
              )

          missing = expected - seen
          if missing:
              raise SystemExit(f"Missing expected bundles: {sorted(missing)}")
          PY

          rm -rf ci-artifacts/check

          mv ci-artifacts/Telegram.ipa ci-artifacts/AyuGram-AltStore.ipa
          ls -lh ci-artifacts/AyuGram-AltStore.ipa

      - name: Cleanup temporary keychain
        if: always()
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/ayugram-codesign.keychain-db"
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload AltStore IPA
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-iOS-AltStore-${{ github.run_number }}
          path: telegram-ios/ci-artifacts/AyuGram-AltStore.ipa
          if-no-files-found: error
